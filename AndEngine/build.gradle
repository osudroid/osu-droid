apply plugin: 'com.android.library'

android {
    namespace 'org.anddev.andengine'
    compileSdk 36
    ndkVersion '30.0.16248370'

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '4.1.2'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    useLibrary 'org.apache.http.legacy'
    lint {
        abortOnError true
        ignoreWarnings true
    }
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy compile_commands.json for arm64-v8a into jni/ so clangd finds it when walking up from jni/frame_timestamps.cpp.
// Without this, it falls back to the system compiler and produces false-positive errors for JNI and C++ standard library types.
tasks.configureEach { task ->
    if (task.name ==~ /configureCMake.*/) {
        task.doLast {
            def ccFile = fileTree('.cxx') {
                include '**/arm64-v8a/compile_commands.json'
                exclude '**/tools/**'
            }.files.max { it.lastModified() }

            if (ccFile != null) {
                copy {
                    from ccFile
                    into 'jni'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
}